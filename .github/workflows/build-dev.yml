name: Dev build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libglfw3-dev libfreetype6-dev libglm-dev zip

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Prepare release package
        run: |
          mkdir -p release_package
          cp build/main release_package/ || true
          cp build/libsgl.so release_package/ || true
          cp -r engine release_package/
          zip -r sgl-release.zip release_package

      # -------------------------------
      # Upload Artifact (GitHub)
      # -------------------------------
      - name: Upload artifact (GitHub)
        if: ${{ startsWith(github.server_url, 'https://github.com') }}
        uses: actions/upload-artifact@v4
        with:
          name: sgl-release
          path: release_package/

      # -------------------------------
      # Upload Artifact (Gitea)
      # -------------------------------
      - name: Upload artifact (Gitea)
        if: ${{ !startsWith(github.server_url, 'https://github.com') }}
        uses: actions/upload-artifact@v3
        with:
          name: sgl-release
          path: release_package/