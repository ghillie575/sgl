name: Dev build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libglfw3-dev libfreetype6-dev libglm-dev zip

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Prepare release package
        run: |
          mkdir -p release_package
          cp build/main release_package/ || true
          cp build/libsgl.so release_package/ || true
          cp -r engine release_package/
          zip -r sgl-release.zip release_package

      # -------------------------------
      # Upload Artifact (GitHub)
      # -------------------------------
      - name: Upload artifact (GitHub)
        if: ${{ startsWith(github.server_url, 'https://github.com') }}
        uses: actions/upload-artifact@v4
        with:
          name: sgl-release
          path: release_package/

      # -------------------------------
      # Upload Artifact (Gitea via API)
      # -------------------------------
      - name: Upload artifact to Gitea
        if: ${{ !startsWith(github.server_url, 'https://github.com') }}
        run: |
          curl -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"build-${{ github.run_number }}\",
              \"name\": \"Build #${{ github.run_number }}\",
              \"body\": \"Automated build from commit ${{ github.sha }}\",
              \"draft\": false,
              \"prerelease\": true
            }" > release.json
          
          RELEASE_ID=$(cat release.json | grep -o '"id":[0-9]*' | head -1 | grep -o '[0-9]*')
          
          curl -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=sgl-release.zip" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @sgl-release.zip